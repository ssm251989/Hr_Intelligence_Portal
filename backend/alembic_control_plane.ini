# Control-plane migration tree (docs/HRMS_COMPLETE_SPEC.txt Part 2 section 2): a separate
# Alembic environment from alembic.ini/alembic/ (tenant-data migrations), pointed at
# CONTROL_PLANE_DATABASE_URL and app.platform.tenancy.models_cp's own metadata, so the two
# histories never mix. Run with: alembic -c alembic_control_plane.ini <command>

[alembic]
script_location = %(here)s/alembic_control_plane
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
