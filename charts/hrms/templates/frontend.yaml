apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hrms.name" . }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      client_max_body_size 12m;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
      location = /nginx-health { access_log off; return 200 "ok"; }
      location /_api/ {
        proxy_pass http://{{ include "hrms.name" . }}-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
      }
      location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
      location / { add_header Cache-Control "no-store"; try_files $uri /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hrms.name" . }}-frontend
  labels: {{- include "hrms.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
  template:
    metadata:
      labels: {{- include "hrms.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "hrms.frontendImage" . }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /nginx-health, port: http } }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts: [{ name: nginx, mountPath: /etc/nginx/conf.d }]
      volumes: [{ name: nginx, configMap: { name: {{ include "hrms.name" . }}-nginx } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hrms.name" . }}-frontend
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
